<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMIK - Поддержать донатом</title>
    <link rel="icon" type="image/png" href="love.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="donate-card">
            <div class="header">
                <span class="family-label">LUMIK FAMILY</span>
            </div>
            
            <div class="avatar-section">
                <div class="avatar-wrapper">
                    <img src="image_2026-10-12_03-01-30.png" alt="LUMIK" class="avatar">
                </div>
            </div>
            
            <div class="author-section">
                <span class="support-label">ПОДДЕРЖАТЬ АВТОРА</span>
                <h1 class="author-name">LUMIK</h1>
                <p class="description">Оставь сообщение и поддержи мой контент!</p>
            </div>
            
            <form id="donateForm" class="donate-form">
                <div class="form-group">
                    <label for="nickname">Ваш ник игры</label>
                    <input type="text" id="nickname" placeholder="Например, LUMIK_777">
                </div>
                
                <div class="form-group">
                    <label for="message">Пара тёплых слов и свой ID</label>
                    <textarea id="message" placeholder="Напиши пару тёплых слов и свой ID:"></textarea>
                </div>
                
                <button type="submit" class="donate-button">
                    Поддержать на 10 ₽
                    <span class="arrow">→</span>
                </button>
            </form>
            
            <div class="footer">
                <a href="https://t.me/lumik_standoff" target="_blank">Поддержка</a>
                <span class="separator">•</span>
                <a href="privacy.html">Политика конфиденциальности</a>
                <span class="separator">•</span>
                <a href="terms.html">Пользовательское соглашение</a>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
